apiVersion: apps/v1
kind: Deployment
metadata:
  name: saga-fe
spec:
  # Staging gate: set to one only in the reviewed private GitOps overlay after
  # configuring the image digest, authentication, exact hostname and recovery.
  replicas: 0
  strategy:
    # SQLite and its WAL must have only one application writer.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: saga-fe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saga-fe
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Replace with the exact digest from a successful publication run.
          image: ghcr.io/bjornarhagen/saga-fe:deployment-not-configured
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4321
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "4321"
            - name: DATABASE_PATH
              value: /data/saga-fe.sqlite
            - name: SAGA_FE_AUTH_REQUIRED
              value: "true"
            - name: SAGA_FE_AUTH_FILE
              value: /run/secrets/saga-fe/auth.json
            - name: SAGA_FE_ALLOWED_HOSTS
              value: saga-fe.example-tailnet.ts.net
            - name: SAGA_FE_PUBLIC_ORIGIN
              value: https://saga-fe.example-tailnet.ts.net
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
              ephemeral-storage: 32Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: auth
              mountPath: /run/secrets/saga-fe
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: saga-fe-data
        - name: auth
          secret:
            secretName: saga-fe-auth
            defaultMode: 0440
            items:
              - key: auth.json
                path: auth.json
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
