apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: saga-fe-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  # Prerequisite: an operator-managed retaining StorageClass. This repository
  # deliberately does not install or change cluster-wide storage resources.
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 1Gi
