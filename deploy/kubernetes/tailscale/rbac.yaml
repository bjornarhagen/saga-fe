apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-saga-fe
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-saga-fe
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [tailscale-saga-fe-state]
    verbs: [get, update, patch]
  # Kubernetes cannot restrict create by resourceName. The proxy has a
  # dedicated namespace so it cannot reach the application's login secret.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-saga-fe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tailscale-saga-fe
subjects:
  - kind: ServiceAccount
    name: tailscale-saga-fe
    namespace: saga-fe-access
