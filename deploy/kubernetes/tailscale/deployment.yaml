apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-saga-fe
spec:
  # Enable only after a reviewed, approved network enrollment.
  replicas: 0
  strategy:
    # Never run two proxies writing the same Tailscale node identity.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tailscale-saga-fe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailscale-saga-fe
    spec:
      serviceAccountName: tailscale-saga-fe
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tailscale
          # Matches the verified userspace proxy baseline in the platform repo.
          image: tailscale/tailscale:v1.102.3@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
          imagePullPolicy: IfNotPresent
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-saga-fe-auth
                  key: authkey
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_USERSPACE
              value: "true"
            - name: TS_HOSTNAME
              value: saga-fe
            - name: TS_KUBE_SECRET
              value: tailscale-saga-fe-state
            - name: TS_SERVE_CONFIG
              value: /etc/tailscale/serve-config.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - name: serve-config
              mountPath: /etc/tailscale
              readOnly: true
            - name: run
              mountPath: /run/tailscale
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: serve-config
          configMap:
            name: saga-fe-serve-config
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
