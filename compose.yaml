name: saga-fe

services:
  app:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:${SAGA_FE_PORT:-5187}:4321"
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
      TRANSACTIONS_FILE: /data/transactions.csv
      DATABASE_PATH: /var/lib/saga-fe/saga-fe.sqlite
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./test:/app/test:ro
      - ./scripts:/app/scripts:ro
      - saga-fe-data:/var/lib/saga-fe
      - ./astro.config.mjs:/app/astro.config.mjs:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - type: bind
        source: ./transactions.csv
        target: /data/transactions.csv
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    init: true
    restart: unless-stopped

volumes:
  saga-fe-data:
