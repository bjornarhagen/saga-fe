# Use scripts/preview.sh so every chat and checkout has its own project and port.
# Preview data is disposable: it resets whenever the container is recreated.
services:
  app:
    build:
      context: .
      target: development
    ports:
      - target: 4321
        published: "${SAGA_FE_PREVIEW_PORT:-0}"
        host_ip: 127.0.0.1
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
      TRANSACTIONS_FILE: ""
      DATABASE_PATH: /var/lib/saga-fe/saga-fe.sqlite
    labels:
      dev.saga-fe.preview: "true"
      dev.saga-fe.checkout: "${SAGA_FE_PREVIEW_CHECKOUT:?Use scripts/preview.sh}"
      dev.saga-fe.session: "${SAGA_FE_PREVIEW_SESSION:?Use scripts/preview.sh}"
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./test:/app/test:ro
      - ./scripts:/app/scripts:ro
      - ./astro.config.mjs:/app/astro.config.mjs:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
    tmpfs:
      - /var/lib/saga-fe:rw,size=64m,uid=1000,gid=1000,mode=0700
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    init: true
    restart: "no"

networks:
  default:
    labels:
      dev.saga-fe.preview: "true"
      dev.saga-fe.checkout: "${SAGA_FE_PREVIEW_CHECKOUT:?Use scripts/preview.sh}"
      dev.saga-fe.session: "${SAGA_FE_PREVIEW_SESSION:?Use scripts/preview.sh}"
